<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barangay Portal</title>
  <style>
    body { margin:0; font-family:sans-serif; background:#0b2545; color:#fff; display:flex; align-items:center; justify-content:center; height:100vh; text-align:center; }
    .ring { width:48px; height:48px; border:5px solid #d9edf7; border-top-color:#2ecc71; border-radius:50%; animation:s .8s linear infinite; margin:0 auto 14px; }
    @keyframes s { to { transform:rotate(360deg); } }
  </style>
</head>
<body>
  <div><div class="ring"></div>Loading Barangay Portal...</div>
</body>
</html>
