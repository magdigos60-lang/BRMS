name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write   # needed to create a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Add Firebase config (needed for push notifications)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Missing secret GOOGLE_SERVICES_JSON (base64 of google-services.json). See README."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json

      - name: Allow camera (QR scanner), notifications and internet
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />#' $MANIFEST
          cat $MANIFEST

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: barangay-portal-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ../barangay-portal.apk
        working-directory: android-app

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Barangay Portal v1.0.${{ github.run_number }}
          body: Android APK build #${{ github.run_number }}. Download barangay-portal.apk below and install it on your phone.
          files: barangay-portal.apk
